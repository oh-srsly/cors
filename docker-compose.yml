services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  video_analyzer:
    build:
      context: .
      dockerfile: video_analyzer/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      VIDEOS_DIR: /videos
    volumes:
      - ./videos:/videos:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  stream_detector:
    build:
      context: .
      dockerfile: stream_detector/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DETECTOR: ${DETECTOR:-mock}
    deploy:
      replicas: 2
    depends_on:
      redis:
        condition: service_healthy
