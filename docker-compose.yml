services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  video_analyzer:
    build:
      context: .
      dockerfile: video_analyzer/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./videos:/app/videos:ro
    depends_on:
      nats:
        condition: service_healthy

  stream_detector:
    build:
      context: .
      dockerfile: stream_detector/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      DETECTOR: ${DETECTOR:-mock}
    deploy:
      replicas: 2
    depends_on:
      nats:
        condition: service_healthy
